# Recommendation tips.
#
# A tip advises a finding whose numbers meet its `condition`. A condition is a
# comparison, {field, op, value} with op one of <, <=, >, >=, ==, != or in (in takes a
# list), or {any: [...]} / {all: [...]} of conditions. Nothing here is evaluated as
# code. `field` names a metric of the finding's evidence, or, for a legacy task, a
# value the task passes.
#
#   checks         core check ids whose findings the tip advises
#   codes          finding codes it is limited to (empty: every code of the check)
#   applicable_to  legacy task names, until those tasks are deleted
#   action         the verb of the step, with an optional `method`
#   when           when the step applies, in words
#   message        the advice

# ===================
# TRANSFORMATION
# ===================

mild_skew_transform:
  condition:
    any:
      - {field: skew, op: ">", value: 1}
      - {field: skew, op: "<", value: -1}
  applicable_to:
    - detect_skewness
    - suggest_numerical_binning
  action: transform
  message: >
    This feature is moderately skewed. Consider log or power transforms
    to improve linear model performance or reduce sensitivity to outliers.

high_cardinality_feature:
  condition: {field: n_unique, op: ">", value: 50}
  checks: [high_cardinality]
  applicable_to:
    - detect_high_cardinality
  action: encode
  method: frequency_encoding
  message: >
    This feature has high cardinality. Consider using frequency encoding,
    target encoding, or dimensionality reduction to avoid sparse features.

# ===================
# LEAKAGE / REDUNDANCY
# ===================

drop_encoded_column:
  condition: {field: match_type, op: in, value: [base64, uuid, hex]}
  applicable_to:
    - detect_encoded_columns
  action: drop
  message: >
    This column appears to be encoded and is unlikely to generalize well.
    Drop it unless it has domain-specific meaning.

drop_duplicate_column:
  condition: {field: n_columns, op: ">=", value: 2}
  checks: [duplicate_columns]
  applicable_to:
    - detect_duplicate_columns
  action: drop
  message: >
    This column is a perfect duplicate of another - remove one to avoid redundant signals.

leaky_feature:
  condition: {field: correlation_with_target, op: ">", value: 0.99}
  applicable_to:
    - detect_data_leakage
  action: drop
  message: >
    This feature is nearly identical to the target - likely due to leakage.
    Drop it unless it was intentionally derived from the target.

drop_constant_column:
  condition: {field: n_unique, op: "<=", value: 1}
  checks: [constant_columns]
  applicable_to:
    - detect_constant_columns
  action: drop
  message: >
    This feature has the same value for all rows - drop it before modeling.

# ===================
# LOW INFORMATION VALUE
# ===================

drop_zero_variance:
  condition: {field: variance, op: "<=", value: 0.0001}
  checks: [near_zero_variance]
  applicable_to:
    - detect_near_zero_variance
  action: drop
  message: >
    This feature has near-zero variance and is unlikely to help model performance.
    Drop it unless it encodes rare but meaningful events.

# ===================
# COLLINEARITY
# ===================

high_vif_feature:
  condition: {field: vif, op: ">", value: 10}
  checks: [collinearity]
  codes: [multicollinearity]
  applicable_to:
    - detect_collinear_features
  action: drop
  when: the column adds nothing a model needs beyond the columns it correlates with
  message: >
    This feature has high collinearity with others, which may distort model coefficients.
    Consider dropping, combining, or using regularization.

high_vif_feature_regularise:
  condition: {field: vif, op: ">", value: 10}
  checks: [collinearity]
  codes: [multicollinearity]
  action: regularise
  method: ridge_or_elastic_net
  when: a linear model must keep every column
  message: >
    Regularisation stabilises the coefficients of columns that move together. A
    tree-based model is not harmed, but it splits importance between them.

high_vif_feature_decorrelate:
  condition: {field: vif, op: ">", value: 20}
  checks: [collinearity]
  codes: [multicollinearity]
  action: transform
  method: pca
  when: the columns are measurements of one underlying quantity
  message: >
    Replace the group of correlated columns with principal components, which are
    uncorrelated by construction. The two partners named in the finding are where
    to start.

# ===================
# CLASS IMBALANCE
# ===================

severe_class_imbalance:
  condition: {field: majority_ratio, op: ">=", value: 0.9}
  applicable_to:
    - detect_class_imbalance
  action: resample
  message: >
    Your target is highly imbalanced. Use stratified sampling, up/down-sampling,
    or metrics like ROC-AUC instead of accuracy.

# ===================
# DRIFT DETECTION
# ===================

high_drift_score:
  condition: {field: psi, op: ">=", value: 0.2}
  applicable_to:
    - detect_feature_drift
  action: monitor
  message: >
    This feature shows significant drift vs. the reference dataset.
    Monitor closely or retrain your model periodically.

# ===================
# SPARSITY
# ===================

zeros_log1p:
  condition: {field: zero_share, op: ">=", value: 0.3}
  checks: [zeros]
  codes: [high_zero_rate]
  action: transform
  method: log1p
  when: zeros are genuine measurements
  message: >
    If zeros are genuine measurements, the column follows a zero-inflated
    distribution: a log1p transform helps a model separate the non-zero values.

zeros_indicator:
  condition: {field: zero_share, op: ">=", value: 0.3}
  checks: [zeros]
  codes: [high_zero_rate]
  action: add_indicator
  method: is_zero
  when: zeros are genuine measurements
  message: >
    Add a binary is_zero feature so a model can tell the zero mass from the
    non-zero distribution.

zeros_placeholder:
  condition: {field: zero_share, op: ">=", value: 0.3}
  checks: [zeros]
  codes: [high_zero_rate]
  action: replace_with_nan
  when: zeros are missing-value placeholders
  message: >
    If zeros stand in for missing values, replace them with NaN before fitting,
    so imputation does not treat them as measurements.

# ===================
# MISSING VALUES
# ===================

missing_drop:
  condition: {field: null_share, op: ">=", value: 0.5}
  checks: [null_rate]
  codes: [high_null_rate]
  action: drop
  when: the missingness is not informative
  message: >
    At this share of missing values imputation adds more bias than signal. Drop
    the column unless the pattern of missingness itself carries information.

missing_indicator:
  condition: {field: null_share, op: ">=", value: 0.2}
  checks: [null_rate]
  codes: [high_null_rate]
  action: add_indicator
  method: is_missing
  when: the pattern of missingness is informative
  message: >
    Keep an is_missing indicator beside the column, so a model can use whether
    the value was recorded.

missing_impute_median:
  condition:
    all:
      - {field: null_share, op: ">=", value: 0.05}
      - {field: null_share, op: "<", value: 0.5}
  checks: [null_rate]
  codes: [high_null_rate]
  action: impute
  method: median
  when: the distribution is skewed
  message: >
    Fill the gaps with the median, which a few extreme values do not move the way
    they move the mean.

missing_impute_model:
  condition:
    all:
      - {field: null_share, op: ">=", value: 0.2}
      - {field: null_share, op: "<", value: 0.5}
  checks: [null_rate]
  codes: [high_null_rate]
  action: impute
  method: model_based
  when: values are missing not at random
  message: >
    If whether a value is missing depends on the value itself or on other
    columns, predict it from the other columns instead of filling a constant.

# ===================
# IDENTIFIERS
# ===================

exclude_identifier:
  condition: {field: unique_share, op: ">=", value: 0.95}
  checks: [id_columns]
  codes: [likely_identifier]
  action: drop
  when: the column is an identifier
  message: >
    A model given an identifier can memorise its rows and then fail on new
    ones. Keep the column for joins and lookups, and out of the features.

# ===================
# DOMINANT VALUE
# ===================

dominant_value_stratify:
  condition: {field: top_share, op: ">=", value: 0.7}
  checks: [dominant_value]
  codes: [dominant_value]
  action: stratified_split
  when: the column is a classification target
  message: >
    Split train and test sets on the column, so the rarer values appear in both.

dominant_value_class_weight:
  condition: {field: top_share, op: ">=", value: 0.7}
  checks: [dominant_value]
  codes: [dominant_value]
  action: class_weight
  when: the column is a classification target
  message: >
    Weight the rarer values up, or use a metric such as ROC-AUC, because always
    predicting the common value already scores well on accuracy.

dominant_value_drop:
  condition: {field: top_share, op: ">=", value: 0.9}
  checks: [dominant_value]
  codes: [dominant_value]
  action: drop
  when: the column is a feature
  message: >
    The column is close to constant and gives a model little to learn from. Drop
    it unless the rare values mark events that matter.

# ===================
# HIGH CARDINALITY
# ===================

high_cardinality_target_encoding:
  condition: {field: n_unique, op: ">", value: 50}
  checks: [high_cardinality]
  codes: [high_cardinality]
  action: encode
  method: target_encoding
  when: a target is available
  message: >
    Replace each value with the mean of the target, computed on the training
    fold only, so the encoding does not leak the target.

high_cardinality_bucket_rare:
  condition: {field: n_unique, op: ">", value: 50}
  checks: [high_cardinality]
  codes: [high_cardinality]
  action: group
  method: bucket_rare_values
  message: >
    Collapse values that are rare into an Other bucket before encoding.

# ===================
# SKEWNESS
# ===================

skew_monitor:
  condition:
    all:
      - {field: skewness, op: ">=", value: -1}
      - {field: skewness, op: "<=", value: 1}
  checks: [skewness]
  codes: [skewed]
  action: monitor
  when: the column goes into a linear model
  message: >
    The skew is mild and most models cope. Check the residuals after fitting;
    a transform may help a little. Tree-based models are unaffected.

skew_log1p:
  condition:
    all:
      - {field: skewness, op: ">", value: 1}
      - {field: min, op: ">=", value: 0}
  checks: [skewness]
  codes: [skewed]
  action: transform
  method: log1p
  when: the values are not negative and the model is linear or distance-based
  message: >
    A log of one plus the value pulls in a long right tail. It needs values of
    zero or more.

skew_sqrt:
  condition:
    all:
      - {field: skewness, op: ">", value: 1}
      - {field: skewness, op: "<=", value: 2}
      - {field: min, op: ">=", value: 0}
  checks: [skewness]
  codes: [skewed]
  action: transform
  method: sqrt
  when: the values are not negative
  message: >
    A square root pulls in a moderate right tail more gently than a log.

skew_box_cox:
  condition:
    all:
      - {field: skewness, op: ">", value: 2}
      - {field: min, op: ">", value: 0}
  checks: [skewness]
  codes: [skewed]
  action: transform
  method: box_cox
  when: every value is positive
  message: >
    A Box-Cox transform fits the power that makes the column closest to normal.
    It needs values above zero.

skew_reflect_then_log:
  condition: {field: skewness, op: "<", value: -1}
  checks: [skewness]
  codes: [skewed]
  action: transform
  method: reflect_then_log
  when: the tail is on the low side
  message: >
    Subtract each value from the maximum, then take a log, to pull in a long
    left tail.

skew_yeo_johnson:
  condition:
    any:
      - {field: skewness, op: ">", value: 1}
      - {field: skewness, op: "<", value: -1}
  checks: [skewness]
  codes: [skewed]
  action: transform
  method: yeo_johnson
  message: >
    A Yeo-Johnson transform handles zero and negative values, so it applies to
    a column whatever its range.

skew_winsorize:
  condition:
    any:
      - {field: skewness, op: ">", value: 2}
      - {field: skewness, op: "<", value: -2}
  checks: [skewness]
  codes: [skewed]
  action: winsorize
  when: the tail is made of a few extreme values
  message: >
    Cap the column at its 1st and 99th percentiles to reduce the pull of the tail.

# ===================
# TAILS
# ===================

heavy_tails_winsorize:
  condition: {field: kurtosis, op: ">=", value: 3}
  checks: [kurtosis]
  codes: [heavy_tails]
  action: winsorize
  when: the model is distance-based or regularised
  message: >
    Fat tails make extreme values ordinary, not anomalous. Cap the column at its
    1st and 99th percentiles before fitting a model that is sensitive to them.

heavy_tails_transform:
  condition: {field: kurtosis, op: ">=", value: 3}
  checks: [kurtosis]
  codes: [heavy_tails]
  action: transform
  method: log1p_or_box_cox
  when: the values are not negative
  message: >
    A log or Box-Cox transform reduces the weight of the tails for linear and
    distance-based models.

heavy_tails_monitor:
  condition:
    all:
      - {field: kurtosis, op: ">=", value: 1}
      - {field: kurtosis, op: "<", value: 3}
  checks: [kurtosis]
  codes: [heavy_tails]
  action: monitor
  when: the model is linear
  message: >
    The tails are somewhat heavy. Check the residuals after fitting, and cap or
    transform the column if extreme values drive the predictions.

# ===================
# SAMPLE SIZE
# ===================

more_rows:
  condition: {field: shortfall, op: ">", value: 0}
  checks: [sample_size]
  action: collect_more_data
  message: >
    Acquire more rows. The finding says how many the rule of thumb asks for.

fewer_features:
  condition: {field: n_features, op: ">", value: 1}
  checks: [sample_size]
  action: reduce_features
  message: >
    Drop low-signal or redundant columns, or reduce them with PCA or feature
    selection, to raise the rows per feature.

cross_validate_small_data:
  condition: {field: shortfall, op: ">", value: 0}
  checks: [sample_size]
  action: cross_validate
  message: >
    Use many folds, such as 10-fold or leave-one-out, to use every row for
    training and evaluation.

# ===================
# TARGET CLASS IMBALANCE
# ===================

target_class_weight:
  condition: {field: majority_share, op: ">=", value: 0.9}
  checks: [class_imbalance]
  codes: [class_imbalance]
  action: class_weight
  method: balanced
  message: >
    Weight the classes inversely to their frequency (`class_weight="balanced"` in
    scikit-learn, `scale_pos_weight` in XGBoost).

target_resample:
  condition: {field: majority_share, op: ">=", value: 0.9}
  checks: [class_imbalance]
  codes: [class_imbalance]
  action: resample
  method: oversample_minority
  when: only on the training split
  message: >
    Oversample the rarer classes, with SMOTE or random oversampling, in the
    training split only, so the validation split does not leak into training.

target_change_metric:
  condition: {field: majority_share, op: ">=", value: 0.9}
  checks: [class_imbalance]
  codes: [class_imbalance]
  action: change_metric
  method: auc_pr_or_f1
  message: >
    Judge a model by precision, recall, F1 or AUC-PR, because accuracy is
    uninformative when one class is nearly all the rows.

# ===================
# SMALLER DTYPES
# ===================

downcast_integer:
  condition: {field: suggested_dtype, op: in, value: [Int8, Int16, Int32]}
  checks: [dtype_optimizations]
  codes: [smaller_dtype]
  action: convert
  method: narrower_integer
  when: the range is known to be stable
  message: >
    Cast the column to the narrower integer type. New values outside its range
    would overflow.

downcast_to_boolean:
  condition: {field: suggested_dtype, op: "==", value: Boolean}
  checks: [dtype_optimizations]
  codes: [smaller_dtype]
  action: convert
  method: boolean
  message: >
    Cast the column to a boolean, after confirming which value is true.

downcast_to_categorical:
  condition: {field: suggested_dtype, op: "==", value: Categorical}
  checks: [dtype_optimizations]
  codes: [smaller_dtype]
  action: convert
  method: categorical
  message: >
    Store the column as a categorical, which keeps each distinct value once and
    one small code per row. Its order is that of the codes unless set.

# ===================
# MEAN-MEDIAN GAP
# ===================

gap_use_median:
  condition: {field: gap_in_std, op: ">=", value: 1}
  checks: [skewness]
  codes: [mean_median_gap]
  action: summarise
  method: median
  message: >
    The mean no longer represents the centre. Summarise the column by its median.

# ===================
# OUTLIERS
# ===================

outliers_winsorize:
  condition: {field: consensus, op: "==", value: true}
  checks: [outliers]
  codes: [outliers_detected]
  action: winsorize
  method: iqr_fences
  when: the extremes are errors, or the model is linear or distance-based
  message: >
    Several rules agree these values are far from the rest. Cap them at the
    fences in the finding, or at the 1st and 99th percentiles, once you have
    checked they are not real.

outliers_robust_scale:
  condition: {field: outlier_share, op: ">", value: 0}
  checks: [outliers]
  codes: [outliers_detected]
  action: scale
  method: robust_scaler
  when: the model is distance-based or uses gradient descent
  message: >
    Scale the column by its median and interquartile range, which a few extreme
    values do not stretch the way they stretch the mean and standard deviation.

outliers_verify_single_rule:
  condition: {field: consensus, op: "==", value: false}
  checks: [outliers]
  codes: [outliers_detected]
  action: investigate
  message: >
    Only one rule flags these values, and each rule makes assumptions the column
    may not meet. Look at them before treating them as errors.

multivariate_anomalies_review:
  condition: {field: n_flagged, op: ">", value: 0}
  checks: [multivariate_outliers]
  codes: [multivariate_anomalies]
  action: investigate
  message: >
    Look at the rows in `example_rows`. A row can be ordinary in every column and
    unusual in their combination: a merged record, a sensor fault, or a rare case.

# ===================
# NORMALITY
# ===================

non_normal_yeo_johnson:
  condition:
    all:
      - {field: mean_abs_deviation_in_std, op: ">=", value: 0.15}
      - {field: min, op: "<", value: 0}
  checks: [normality]
  codes: [non_normal]
  action: transform
  method: yeo_johnson
  when: the model assumes normal inputs
  message: >
    A Yeo-Johnson power transform handles negative values and pulls the column
    toward a normal.

non_normal_box_cox:
  condition:
    all:
      - {field: mean_abs_deviation_in_std, op: ">=", value: 0.15}
      - {field: min, op: ">", value: 0}
  checks: [normality]
  codes: [non_normal]
  action: transform
  method: box_cox
  when: the model assumes normal inputs
  message: >
    A Box-Cox transform fits the power that makes the column closest to normal. It
    needs values above zero.

non_normal_judge_residuals:
  condition: {field: alpha, op: ">", value: 0}
  checks: [normality]
  codes: [non_normal]
  action: monitor
  when: the model is linear
  message: >
    Linear models assume normal residuals, not normal inputs. Fit first, and
    transform only if the residuals are far from normal.

# ===================
# BIMODALITY
# ===================

bimodal_segment:
  condition: {field: bic_delta, op: ">", value: 0}
  checks: [bimodality]
  codes: [bimodal]
  action: segment
  when: a group column that splits the two peaks is known
  message: >
    Two peaks often mean two populations. Split by the column that separates them,
    or add it, with an interaction, to the model.

bimodal_cluster_indicator:
  condition: {field: separation, op: ">=", value: 3}
  checks: [bimodality]
  codes: [bimodal]
  action: add_feature
  method: gmm_cluster_indicator
  when: no known column explains the peaks
  message: >
    The peaks are cleanly apart. Add the cluster each value belongs to, from the
    two-component mixture, as a feature.

bimodal_tree_model:
  condition: {field: bic_delta, op: ">", value: 0}
  checks: [bimodality]
  codes: [bimodal]
  action: use_tree_model
  message: >
    Tree-based models split on thresholds and cope with two peaks without a
    transform; linear and Gaussian models do not.

# ===================
# OUT OF BOUNDS
# ===================

out_of_bounds_investigate:
  condition: {field: violation_count, op: ">", value: 0}
  checks: [out_of_bounds]
  codes: [out_of_bounds]
  action: investigate
  message: >
    Find out whether the values outside the range are errors, a unit mismatch or
    real cases the range does not allow for.

out_of_bounds_cap:
  condition: {field: violation_count, op: ">", value: 0}
  checks: [out_of_bounds]
  codes: [out_of_bounds]
  action: winsorize
  method: clip_to_bounds
  when: the values are errors and the rows must be kept
  message: >
    Clip the column to its declared range.

out_of_bounds_remove_rows:
  condition: {field: violation_count, op: ">", value: 0}
  checks: [out_of_bounds]
  codes: [out_of_bounds]
  action: remove_rows
  when: the values are confirmed entry errors
  message: >
    Drop the rows with values outside the range. They would distort what a model
    learns at the edges.

# ===================
# ASSOCIATIONS
# ===================

redundant_columns_drop_one:
  condition: {field: abs_pearson_r, op: ">=", value: 0.99}
  checks: [associations]
  codes: [redundant_columns]
  action: drop
  when: the two columns hold the same information, and one is not needed for reporting
  message: >
    Keep one of the two columns. A near-exact copy adds no signal, and in a linear
    model it makes the coefficients unstable.

redundant_columns_trace_source:
  condition: {field: abs_pearson_r, op: ">=", value: 0.99}
  checks: [associations]
  codes: [redundant_columns]
  action: investigate
  message: >
    Find out how the columns relate: a unit conversion, a ratio, a running total or
    a join that repeated a measure. Keep the one closest to the source.

strong_association_check_derivation:
  condition: {field: abs_value, op: ">=", value: 0.7}
  checks: [associations]
  codes: [strong_association]
  action: investigate
  message: >
    Check whether one of the columns is derived from the other before using both
    as features. If neither is, a strong link is a relationship worth modelling.

categorical_association_combine:
  condition: {field: cramers_v_corrected, op: ">=", value: 0.5}
  checks: [contingency]
  codes: [categorical_association]
  action: combine
  method: interaction_feature
  when: a linear model uses both columns as features
  message: >
    The second column adds little beyond the first. Encode only one of them, or
    combine the two into a single interaction feature.

categorical_association_inspect_table:
  condition: {field: cramers_v_corrected, op: ">=", value: 0.1}
  checks: [contingency]
  codes: [categorical_association]
  action: investigate
  message: >
    Read the table for the combinations that occur more or less often than
    independence predicts; they say what the link is.

# ===================
# GROUP DIFFERENCES
# ===================

group_difference_inspect_groups:
  condition: {field: effect, op: ">=", value: 0.01}
  checks: [group_differences]
  codes: [group_difference]
  action: investigate
  message: >
    Compare the groups' distributions, starting with the highest and the lowest
    named in the finding. A difference this size can be a real effect, a different
    mix of customers or sources, or a column that records the outcome of the
    other.

group_difference_use_grouping_column:
  condition: {field: effect, op: ">=", value: 0.14}
  checks: [group_differences]
  codes: [group_difference]
  action: encode
  when: the grouping column is known when a prediction is made
  message: >
    The grouping column explains a large part of the numeric column, so it is a
    useful feature for predicting it. Check it is available at prediction time,
    and consider fitting a model per group if the groups behave differently.

# ===================
# MISSINGNESS MECHANISM
# ===================

missingness_impute_with_predictors:
  condition: {field: tests_flagged, op: ">=", value: 1}
  checks: [missingness_mechanism]
  codes: [missingness_depends_on_observed]
  action: impute
  method: multiple_imputation
  when: the columns named in the finding are kept as predictors of the imputation
  message: >
    The nulls follow other columns, so a median or a mode fills them with a value
    that is wrong in a known direction. Impute from those columns (for example
    with chained equations), or let a tree-based model handle the nulls itself.

missingness_dropping_rows_biases:
  condition:
    all:
      - {field: tests_flagged, op: ">=", value: 1}
      - {field: null_share, op: ">=", value: 0.1}
  checks: [missingness_mechanism]
  codes: [missingness_depends_on_observed]
  action: investigate
  message: >
    Dropping the rows with a null removes more of some kinds of row than others,
    so the rows that remain are not typical. Compare the kept and dropped rows
    before choosing to drop them, and ask how the column was collected.

missingness_indicator:
  condition:
    all:
      - {field: tests_flagged, op: ">=", value: 1}
      - {field: null_share, op: ">=", value: 0.05}
  checks: [missingness_mechanism]
  codes: [missingness_depends_on_observed]
  action: add_indicator
  method: is_missing
  when: the pattern of missingness is informative
  message: >
    Keep an is_missing indicator beside the column, so a model can use that the
    value was not recorded for rows of the kind named in the finding.

missingness_simple_imputation:
  condition: {field: null_share, op: ">=", value: 0.05}
  checks: [missingness_mechanism]
  codes: [missingness_unexplained]
  action: impute
  method: median_or_mode
  when: the column is known to be collected the same way for every row
  message: >
    No other column explains the nulls, so a simple imputation or dropping the
    rows costs little bias if they fall at random. Confirm how the column was
    collected, because nulls that depend on their own value cannot be seen here.

# ===================
# STRING ANOMALIES
# ===================

string_case_normalise:
  condition: {field: affected_rows, op: ">=", value: 1}
  checks: [string_anomalies]
  codes: [mixed_case]
  action: transform
  method: str.lower
  message: >
    Fold the values to one case (or map each variant to its most frequent
    spelling) before counting, grouping or encoding the column.

string_whitespace_strip:
  condition: {field: affected_rows, op: ">=", value: 1}
  checks: [string_anomalies]
  codes: [edge_whitespace]
  action: transform
  method: str.strip
  message: >
    Strip leading and trailing whitespace when the data is read, so a padded
    value is the same category as its trimmed form.

string_invisible_normalise:
  condition: {field: affected_rows, op: ">=", value: 1}
  checks: [string_anomalies]
  codes: [invisible_characters]
  action: transform
  method: unicode_normalise_and_strip
  message: >
    Remove zero-width, no-break and control characters (and apply Unicode NFKC
    normalisation if the text is meant to be compared), then compare again.

string_long_values_inspect:
  condition: {field: affected_rows, op: ">=", value: 1}
  checks: [string_anomalies]
  codes: [length_outliers]
  action: investigate
  message: >
    Read the longest and the shortest values. A long value in a label column is
    often several fields joined, an error message or markup, and may need
    splitting, truncating or excluding.

# ===================
# ENCODED COLUMNS
# ===================

encoded_column_drop:
  condition: {field: encoded_share, op: ">=", value: 0.9}
  checks: [encoded_columns]
  codes: [encoded_values]
  action: drop
  when: the column is a key or a fingerprint, not a measurement
  message: >
    A column of hashes or UUIDs names a record and carries no signal a model can
    generalise from; as a feature it only lets the model memorise rows. Keep it
    as a key and leave it out of the features.

encoded_column_decode:
  condition: {field: kind, op: "==", value: base64}
  checks: [encoded_columns]
  codes: [encoded_values]
  action: transform
  method: base64_decode
  when: the encoded text holds something meaningful
  message: >
    Base64 only changes how text or bytes are written. Decode it and see whether
    the result is a field worth keeping.

# ===================
# MIXED TYPES AND FORMATS
# ===================

mixed_types_coerce:
  condition: {field: kinds, op: ">=", value: 2}
  checks: [mixed_types]
  codes: [mixed_value_types]
  action: convert
  method: coerce_and_flag
  message: >
    Decide what the column should hold, convert the values that fit and set the
    others to null (keeping them in a separate column if they mean something,
    such as a code for "unknown").

format_violations_review:
  condition: {field: violations, op: ">=", value: 1}
  checks: [format_violations]
  codes: [format_violations]
  action: investigate
  message: >
    Read the examples. Violations that differ only by padding, case or a missing
    separator can be normalised; the rest need a decision about the source.

date_formats_unify:
  condition: {field: formats, op: ">=", value: 2}
  checks: [format_violations]
  codes: [mixed_date_formats]
  action: convert
  method: parse_each_format_to_iso8601
  message: >
    Parse each format with its own pattern and write all of them as ISO 8601. Do
    not rely on a parser that guesses: a day-first and a month-first date read
    the same digits differently.

# ===================
# NEAR-DUPLICATE ROWS
# ===================

near_duplicate_rows_review:
  condition: {field: pairs_flagged, op: ">=", value: 1}
  checks: [fuzzy_duplicates]
  codes: [near_duplicate_rows]
  action: investigate
  message: >
    Read the listed pairs. A pair that differs by a typo, case or padding is one
    record entered twice; a pair that differs in a name or a number that matters
    is two records that happen to look alike. Settle which before merging.

near_duplicate_rows_normalise:
  condition: {field: rows_involved_share, op: ">=", value: 0.01}
  checks: [fuzzy_duplicates]
  codes: [near_duplicate_rows]
  action: transform
  method: normalise_then_deduplicate
  message: >
    Lower-case, trim and collapse the spaces of the text columns, then drop exact
    duplicates again, so the pairs that differ only in case or padding collapse
    before the rest are reviewed by hand.

# ===================
# DATETIME
# ===================

datetime_extract_features:
  condition: {field: n_features, op: ">=", value: 1}
  checks: [datetime_features]
  codes: [extractable_features]
  action: add_feature
  method: calendar_parts
  message: >
    Derive the listed features from the column and drop the raw timestamp as a
    model input. Derive them before the train-test split from the full column, and
    check that `year` does not just stand in for the target drifting over time.

datetime_cyclic_encoding:
  condition: {field: n_cyclic, op: ">=", value: 1}
  checks: [datetime_features]
  codes: [extractable_features]
  action: encode
  method: sin_cos
  message: >
    Encode the cyclic features as a sine and a cosine of 2π times the value over
    its period (12 months, 7 weekdays, 24 hours), so December sits next to January
    and 23:00 next to 00:00. Tree-based models can use the plain integer.

datetime_gaps_resample:
  condition: {field: n_gaps, op: ">=", value: 1}
  checks: [temporal_gaps]
  codes: [gaps]
  action: resample
  message: >
    Resample to the dominant frequency and decide per gap whether to interpolate
    short ones or analyse the separate stretches; do not forward-fill across a
    long gap.

datetime_gaps_investigate:
  condition: {field: n_gaps, op: ">=", value: 1}
  checks: [temporal_gaps]
  codes: [gaps]
  action: investigate
  message: >
    Find where the gaps are. A gap at weekends or holidays is a calendar; a gap in
    the middle of a working week is data that was not collected.

irregular_spacing_set_frequency:
  condition: {field: distinct, op: ">=", value: 1}
  checks: [temporal_gaps]
  codes: [irregular_spacing]
  action: resample
  message: >
    Aggregate to a fixed frequency (hourly, daily, weekly) that suits the question,
    and pass it as `frequency` to the time-series checks.

unparsed_dates_investigate:
  condition: {field: unparsed, op: ">=", value: 1}
  checks: [datetime_consistency]
  codes: [unparsed_values]
  action: investigate
  message: >
    List the values that do not read. Mixed formats can each be parsed with their
    own pattern; placeholders such as "N/A" or "0000-00-00" are missing values.

stationarity_difference:
  condition: {field: assessment, op: "==", value: consistent_with_non_stationary}
  checks: [stationarity]
  codes: [non_stationary]
  action: transform
  method: difference
  message: >
    Difference the series (or the seasonal difference, if it has a cycle) and test
    it again; if a deterministic trend explains the drift, subtract the trend
    instead.

stationarity_ambiguous_detrend:
  condition:
    {field: assessment, op: "==", value: ambiguous_trend_stationary_or_structural_break}
  checks: [stationarity]
  codes: [ambiguous_stationarity]
  action: investigate
  message: >
    Plot the series. A steady trend is removed by detrending; a sudden change in
    level is a structural break, and the two halves are better analysed apart.

autocorrelation_time_split:
  condition: {field: n_flagged_acf, op: ">=", value: 1}
  checks: [autocorrelation]
  codes: [autocorrelated]
  action: stratified_split
  method: time_ordered
  message: >
    Split train and test by time, never at random, and cross-validate with
    expanding or rolling windows; neighbouring rows are not independent.

autocorrelation_lag_features:
  condition: {field: n_flagged_pacf, op: ">=", value: 1}
  checks: [autocorrelation]
  codes: [autocorrelated]
  action: add_feature
  method: lagged_values
  message: >
    The partial autocorrelation names the lags that add information on their own;
    add those lags of the series as features.

seasonality_seasonal_difference:
  condition: {field: seasonal_strength, op: ">=", value: 0.4}
  checks: [seasonal_decomposition]
  codes: [seasonal]
  action: transform
  method: seasonal_difference
  message: >
    Model the cycle with calendar features (position in the cycle) or subtract the
    value one period earlier, and keep whole cycles together in a split.

trend_detrend:
  condition: {field: trend_strength, op: ">=", value: 0.4}
  checks: [seasonal_decomposition]
  codes: [trend]
  action: transform
  method: detrend
  message: >
    Difference the series or subtract its fitted trend before a model that
    assumes a stable level, and validate on the most recent periods.

# ===================
# DRIFT AGAINST A REFERENCE
# ===================

reference_drift_investigate:
  condition: {any: [{field: psi, op: ">=", value: 0}, {field: tvd, op: ">=", value: 0}]}
  checks: [reference_drift]
  codes: [distribution_shift]
  action: investigate
  message: >
    Find out why the column moved: a change in how the data is collected, a new
    population, a unit or encoding change upstream, or a real shift in the world.
    Compare the largest shifts in the evidence with what the source says changed.

reference_drift_retrain:
  condition: {field: level, op: ==, value: high}
  checks: [reference_drift]
  codes: [distribution_shift]
  action: monitor
  when: a model or rule was fitted on the reference
  message: >
    A model fitted on the reference sees inputs it was not trained on. Monitor its
    error on the new data, and retrain on a window that includes it if the error
    grows. Do not retrain on drift alone: the shift can be a data defect.

reference_target_drift_relabel:
  condition: {field: level, op: in, value: [moderate, high]}
  checks: [reference_drift]
  codes: [target_drift]
  action: investigate
  message: >
    The target's distribution changed, so the model's learned base rate is wrong
    for the new data. Check how the label is produced (a definition, a threshold or
    a labelling team that changed) before judging the model on the new data.

reference_target_drift_reweight:
  condition: {field: level, op: in, value: [moderate, high]}
  checks: [reference_drift]
  codes: [target_drift]
  action: resample
  when: the new label balance is real and will persist
  message: >
    Retrain on a sample that matches the new label balance, or reweight the loss,
    and recalibrate predicted probabilities on recent data.

reference_missingness_investigate:
  condition: {field: change, op: "!=", value: 0}
  checks: [reference_drift]
  codes: [missingness_shift]
  action: investigate
  message: >
    The share of nulls moved. A source that stopped filling a field, a join that
    lost matches, or a new placeholder spelling are the usual causes. Fix the
    pipeline if it is a defect; if it is real, check that the imputation fitted on
    the reference still suits the new rate.

reference_type_changed_convert:
  condition: {field: type_changed, op: ==, value: true}
  checks: [reference_drift]
  codes: [type_changed]
  action: convert
  message: >
    Cast the column back to its type in the reference before it reaches a model or
    a join, and find out which step upstream changed how it is written.

reference_columns_added_decide:
  condition: {field: n_columns, op: ">=", value: 1}
  checks: [reference_drift]
  codes: [columns_added]
  action: investigate
  message: >
    A model or query built on the reference ignores these columns. Decide whether
    they belong in the pipeline, and drop them where a fixed schema is expected.

reference_columns_dropped_restore:
  condition: {field: n_columns, op: ">=", value: 1}
  checks: [reference_drift]
  codes: [columns_dropped]
  action: investigate
  message: >
    Anything that reads these columns will fail or silently fill them. Find out
    whether the source stopped sending them or renamed them, and restore or map
    them before the data is used.

reference_target_missing_investigate:
  condition: {field: target_missing, op: ==, value: true}
  checks: [reference_drift]
  codes: [target_missing_in_reference]
  action: investigate
  message: >
    The reference has no column of the target's name, so the target cannot be
    compared. Check the name, or pass a reference that has it.
