exclude: ^dsbf/outputs/|dsbf_run.json|^\.pyrefly-baseline\.json$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in step with the ruff version in uv.lock: CI installs that version.
    rev: v0.17.0
    hooks:
      # Linter — runs ruff check --fix (auto-fixes safe rules)
      - id: ruff
        args: [--fix]
      # Formatter — runs ruff format (replaces black)
      - id: ruff-format
