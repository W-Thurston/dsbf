# dsbf/static_metadata/task_catalog.yaml
#
# Living specification for all registered DSBF tasks.
# Fields mirror the @register_task decorator arguments plus audit metadata.
# Update this file whenever a task is added, removed, or re-phased.
#
# Fields:
#   name          : registry key (snake_case, matches @register_task name=)
#   display_name  : human-readable label shown in dashboard
#   phase         : "eda" | "ml_readiness" | "diagnostic"
#   stage         : "raw" | "cleaned" | "modeling" | "report" | "any"
#   profiling_depth: "basic" | "standard" | "full"
#   runtime_estimate: "fast" | "moderate" | "slow"
#   depends_on    : list of task names that must run first
#   semantic_types: expected_semantic_types from decorator
#   tags          : list of string tags
#   status        : "stable" | "new" | "planned" | "deprecated"
#   notes         : optional free-text annotation

