  status: stable
  notes: >
    Recommends dtype downcasts: int64→int8/16/32 (range-based), float64→float32
    (safe-range check), object→category (categorical intent), int/object→bool
    (two distinct values). Reads column_memory_bytes from summarize_dataset_shape
    for exact savings estimates. min_savings_bytes threshold (default 1024)
    prevents noise on small columns. Purely advisory - never modifies the DataFrame.

- name: sample_size_adequacy
  display_name: Sample Size Adequacy
  phase: ml_readiness
  stage: raw
  profiling_depth: basic
  runtime_estimate: fast
  depends_on: [infer_types]
  semantic_types: [any]
  tags: [sample_size, ml_readiness, overview]
  status: stable
  notes: >
    Three rule-of-thumb checks: linear/logistic (20 rows/feature, min 50),
    tree-based (10 rows/feature, min 100), general ML (5 rows/feature, min 1000).
    Verdict: adequate / limited / insufficient. Feature count excludes id/datetime
    columns. n_features_override param for partial-column modeling scenarios.
    ML guidance with collect_more_data, reduce_features, use_cross_validation
    action chips emitted under __dataset__ sentinel key for failing rules.

- name: imputation_strategy_suggestions
  display_name: Imputation Strategy Suggestions
  phase: ml_readiness
  stage: cleaned
  profiling_depth: standard
  runtime_estimate: fast
  depends_on: [infer_types, summarize_nulls]
  semantic_types: [any]
  tags: [missingness, imputation, ml_readiness]
  status: stable
  notes: >
    Per-column imputation strategy based on null tier (severe ≥50%, significant
    ≥20%, moderate ≥5%, low <5%), semantic intent, and distribution skew.
    Categorical → mode; datetime → forward fill; continuous → mean/median/KNN
    based on tier and skew. Reads null_percentages from summarize_nulls context
    result; reads skewed columns from detect_skewness context result. Both fall
    back to direct computation if upstream tasks have not run.

