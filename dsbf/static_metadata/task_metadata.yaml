# ── EDA tasks - relationships & correlations ──────────────────────────────────

- name: compute_pairwise_associations
  display_name: Compute Pairwise Associations
  phase: eda
  stage: cleaned
  profiling_depth: full
  runtime_estimate: moderate
  depends_on: [infer_types]
  semantic_types: [any]
  tags: [correlation, association, relationships]
  status: stable
  notes: >
    Single source of truth for all pairwise column relationships. Supersedes
    kendalls_tau (now deprecated). Type-aware metric routing:
    continuousxcontinuous via method param (see below), point-biserial r
    (continuousxbinary), eta-squared (continuousxcategorical), Cramers V
    (categoricalxcategorical). Method options: "auto" (default) routes to
    Kendalls tau-b for n<30 and Pearson r for n>=30; "pearson"; "spearman";
    "kendall" (always tau); "both" (Pearson primary + Spearman secondary).
    Produces __correlation_matrix__ for heatmap rendering. Reliability
    warnings: low_row_count, zero_variance, extreme_outliers, high_skew.

