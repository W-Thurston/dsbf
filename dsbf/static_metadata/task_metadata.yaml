# ── EDA tasks - relationships & correlations ──────────────────────────────────

- name: compute_pairwise_associations
  display_name: Compute Pairwise Associations
  phase: eda
  stage: cleaned
  profiling_depth: full
  runtime_estimate: moderate
  depends_on: [infer_types]
  semantic_types: [any]
  tags: [correlation, association, relationships]
  status: stable
  notes: >
    Single source of truth for all pairwise column relationships.
    Type-aware metric routing: Pearson or Spearman r (continuousxcontinuous,
    configurable via method param), point-biserial r (continuousxbinary),
    eta-squared (continuousxcategorical), Cramér's V (categoricalxcategorical).
    Also produces __correlation_matrix__ nested dict in data for heatmap
    consumption by generate_dataset_summary_plots. Reliability warnings:
    low_row_count, zero_variance, extreme_outliers, high_skew.

