  phase: eda
  stage: cleaned
  profiling_depth: standard
  runtime_estimate: fast
  depends_on: [infer_types, normality_tests]
  semantic_types: [continuous]
  tags: [distribution, normality, visualization, numeric]
  status: stable
  notes: >
    Theoretical vs empirical quantile pairs for normal QQ plots. Reference
    line via Q1/Q3 anchor points. Deviation summary: mean_abs_deviation,
    tail_deviation_lower/upper. Prioritises non_normal columns from
    normality_tests; include_normal param extends to passing columns.
    Data-only output - feeds frontend QQ renderer, no static images generated.

# ── EDA tasks - statistical tests & robust methods ───────────────────────────

- name: outlier_detection_mad
  display_name: Outlier Detection (MAD)
  phase: eda
  stage: cleaned
  profiling_depth: standard
  runtime_estimate: fast
  depends_on: [infer_types]
  semantic_types: [continuous]
  tags: [outliers, numeric, robust, mad]
  status: stable
  notes: >
    Modified Z-score (0.6745 x (x - median) / MAD) with default threshold 3.5
    (Iglewicz & Hoaglin 1993). Robust to skewed distributions and existing
    outliers - median and MAD are not corrupted by the values being detected.
    Complements detect_outliers (IQR/Z-score). Columns where MAD=0 are skipped.

- name: one_way_anova
  display_name: One-Way ANOVA
  phase: eda
  stage: cleaned
  profiling_depth: standard
  runtime_estimate: fast
  depends_on: [infer_types]
  semantic_types: [continuous, categorical]
  tags: [anova, statistics, relationships, numeric, categorical]
  status: stable
  notes: >
    F-test for whether group means differ across categorical levels.
    p-value companion to eta-squared in compute_pairwise_associations.
    FDR/Bonferroni correction via correction param (default "fdr_bh"):
    all tests collected first, corrected p-values computed in a single pass.
    Both raw p_value and p_value_corrected stored per entry; significant flag
    uses corrected value. n_tests reported in metadata and guidance blurbs.
    Assumes normality within groups and equal variances; use kruskal_wallis
    when these are violated.

- name: kruskal_wallis
  display_name: Kruskal-Wallis Test
  phase: eda
  stage: cleaned
  profiling_depth: standard
  runtime_estimate: fast
  depends_on: [infer_types]
  semantic_types: [continuous, categorical]
  tags: [kruskal_wallis, statistics, relationships, non_parametric]
  status: stable
  notes: >
    Non-parametric alternative to one-way ANOVA. Tests distributional
    differences across groups without normality or equal-variance assumptions.
    FDR/Bonferroni correction via correction param (default "fdr_bh"); same
    two-phase approach as one_way_anova. A significant result means at least
    one group differs; use mann_whitney_u for post-hoc pairwise localisation.

- name: mann_whitney_u
  display_name: Mann-Whitney U Test
  phase: eda
  stage: cleaned
  profiling_depth: standard
  runtime_estimate: fast
  depends_on: [infer_types]
  semantic_types: [continuous, categorical]
  tags: [mann_whitney, statistics, relationships, non_parametric]
  status: stable
  notes: >
    Non-parametric pairwise comparison for continuous vs two-level categorical.
    Reports U statistic, p-value, rank-biserial r effect size, and corrected
    p-value. FDR/Bonferroni correction via correction param (default "fdr_bh")
    applied across all (continuous x categorical x level_pair) combinations in
    a single pass. Tests all level pairs up to max_pairs_per_column.
    Post-hoc complement to kruskal_wallis.

- name: temporal_gap_detection
  display_name: Temporal Gap Detection
  phase: eda
  stage: cleaned
  profiling_depth: standard
  runtime_estimate: fast
  depends_on: [infer_types]
  semantic_types: [datetime]
  tags: [datetime, gaps, time_series, quality]
  status: stable
  notes: >
    Identifies gaps in datetime columns exceeding 2x the dominant (most common)
    inter-observation interval. Dominant gap computed as mode of rounded gap
    lengths; falls back to median for irregular event data. EDA guidance with
    investigate_gaps and resample_or_interpolate action chips.

- name: fuzzy_duplicate_detection
  display_name: Fuzzy Duplicate Detection
  phase: eda
  stage: cleaned
  profiling_depth: standard
  runtime_estimate: moderate
  depends_on: [infer_types]
  semantic_types: [categorical, text]
  tags: [duplicates, rows, fuzzy, quality, string]
  status: stable
  notes: >
    Detects near-duplicate rows via token-based blocking (inverted index) +
    difflib.SequenceMatcher character similarity. No extra dependencies (stdlib
    only). similarity_threshold configurable (default 0.85). Sampling when
    n > max_comparison_rows (default 5000) with reliability warning. Findings
    stored under __dataset__ sentinel key (row-level, not column-level).
    Complements detect_duplicates (exact matches).

# ── Wave 4 - architectural decisions required ────────────────────────────────

- name: detect_multivariate_outliers
  display_name: Detect Multivariate Outliers
  phase: eda
  stage: cleaned
  profiling_depth: full
  runtime_estimate: slow
  depends_on: [infer_types]
  semantic_types: [continuous]
  tags: [outliers, multivariate, isolation_forest]
  status: planned
  notes: >
    Isolation Forest-based multivariate outlier detection on continuous columns.
    Complements univariate detect_outliers - a row can be normal on every
    individual axis but anomalous in the joint distribution. Requires design
    decision: row-level findings in a column-oriented guidance system (likely
    via __dataset__ sentinel key with flagged row indices in data).
