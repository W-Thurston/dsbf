- name: compute_mutual_information
  display_name: Compute Mutual Information
  phase: eda
  stage: cleaned
  profiling_depth: full
  runtime_estimate: moderate
  depends_on: [infer_types]
  semantic_types: [continuous, categorical]
  tags: [mutual_information, relationships, feature_selection]
  status: stable
  notes: >
    mutual_info_regression (continuous target) or mutual_info_classif
    (categorical target) via sklearn. Type-aware: categorical features passed
    with discrete_features=True. Normalised MI score (÷ log(n_samples)) for
    cross-dataset comparability. Strength labels: high/moderate/low/negligible.
    Graceful no-op when target_column not configured.

- name: contingency_tables
  display_name: Contingency Tables
  phase: eda
  stage: cleaned
  profiling_depth: standard
  runtime_estimate: fast
  depends_on: [infer_types]
  semantic_types: [categorical]
  tags: [categorical, association, chi_squared, relationships]
  status: stable
  notes: >
    Joint frequency tables for categoricalxcategorical pairs with chi-squared
    independence test (statistic, p-value, dof) and Cramér's V effect size.
    top_n (default 10) limits table size; truncated flag set when full
    cardinality not used. Complements compute_pairwise_associations by
    providing raw frequency structure behind the scalar V.

- name: transformation_preview
  display_name: Transformation Preview
  phase: eda
  stage: cleaned
  profiling_depth: standard
  runtime_estimate: fast
  depends_on: [infer_types, detect_skewness]
  semantic_types: [continuous]
  tags: [transformation, distribution, numeric, preview]
  status: stable
  notes: >
    Before/after distribution stats for log1p, sqrt, square, and Yeo-Johnson
    transforms on skewed columns. Skewness reduction percentage computed per
    transform; recommended flag set on best. Reads detect_skewness context
    result; falls back to direct computation. Purely advisory.

