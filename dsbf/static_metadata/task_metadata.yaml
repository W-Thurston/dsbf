  display_name: Normality QQ Plots
  phase: eda
  stage: cleaned
  profiling_depth: standard
  runtime_estimate: fast
  depends_on: [infer_types, normality_tests]
  semantic_types: [continuous]
  tags: [distribution, normality, visualization, numeric]
  status: stable
  notes: >
    Theoretical vs empirical quantile pairs for normal QQ plots. Reference
    line via Q1/Q3 anchor points. Deviation summary: mean_abs_deviation,
    tail_deviation_lower/upper. Prioritises non_normal columns from
    normality_tests; include_normal param extends to passing columns.
    Data-only output - feeds frontend QQ renderer, no static images generated.

# ── EDA tasks - statistical tests & robust methods ───────────────────────────

- name: kendalls_tau
  display_name: Kendall's Tau
  phase: eda
  stage: cleaned
  profiling_depth: full
  runtime_estimate: moderate
  depends_on: [infer_types]
  semantic_types: [continuous]
  tags: [correlation, rank, relationships, numeric]
  status: stable
  notes: >
    Kendall's tau-b rank correlation for all continuous column pairs.
    Preferred over Spearman for small samples (n < 30) and tied data.
    Direct probabilistic interpretation: tau=0.6 means 60% more concordant
    than discordant pairs. EDA guidance for significant pairs with |tau| ≥ 0.2.

- name: one_way_anova
  display_name: One-Way ANOVA
  phase: eda
  stage: cleaned
  profiling_depth: standard
  runtime_estimate: fast
  depends_on: [infer_types]
  semantic_types: [continuous, categorical]
  tags: [anova, statistics, relationships, numeric, categorical]
  status: stable
  notes: >
    F-test for whether group means differ across categorical levels.
    p-value companion to eta-squared in compute_pairwise_associations.
    FDR/Bonferroni correction via correction param (default "fdr_bh"):
    all tests collected first, corrected p-values computed in a single pass.
    Both raw p_value and p_value_corrected stored; significant flag uses
    corrected value. Assumes normality within groups and equal variances;
    use kruskal_wallis when these are violated.

- name: kruskal_wallis
  display_name: Kruskal-Wallis Test
  phase: eda
  stage: cleaned
  profiling_depth: standard
  runtime_estimate: fast
  depends_on: [infer_types]
  semantic_types: [continuous, categorical]
  tags: [kruskal_wallis, statistics, relationships, non_parametric]
  status: stable
  notes: >
    Non-parametric alternative to one-way ANOVA. Tests distributional
    differences across groups without normality or equal-variance assumptions.
    FDR/Bonferroni correction via correction param (default "fdr_bh"); same
    two-phase approach as one_way_anova. A significant result means at least
    one group differs; use mann_whitney_u for post-hoc pairwise localisation.

- name: mann_whitney_u
  display_name: Mann-Whitney U Test
  phase: eda
  stage: cleaned
  profiling_depth: standard
  runtime_estimate: fast
  depends_on: [infer_types]
  semantic_types: [continuous, categorical]
  tags: [mann_whitney, statistics, relationships, non_parametric]
  status: stable
  notes: >
    Non-parametric pairwise comparison for continuous vs two-level categorical.
    Reports U statistic, p-value, rank-biserial r effect size, and corrected
    p-value. FDR/Bonferroni correction via correction param (default "fdr_bh")
    applied across all (continuous x categorical x level_pair) combinations.
    Tests all level pairs up to max_pairs_per_column. Post-hoc complement to
    kruskal_wallis.

- name: temporal_gap_detection
  display_name: Temporal Gap Detection
  phase: eda
  stage: cleaned
  profiling_depth: standard
  runtime_estimate: fast
  depends_on: [infer_types]
  semantic_types: [datetime]
  tags: [datetime, gaps, time_series, quality]
  status: stable
  notes: >
    Identifies gaps in datetime columns exceeding 2x the dominant (most common)
    inter-observation interval. Dominant gap computed as mode of rounded gap
    lengths; falls back to median for irregular event data. EDA guidance with
    investigate_gaps and resample_or_interpolate action chips.

- name: fuzzy_duplicate_detection
  display_name: Fuzzy Duplicate Detection
  phase: eda
  stage: cleaned
  profiling_depth: standard
  runtime_estimate: moderate
  depends_on: [infer_types]
  semantic_types: [categorical, text]
  tags: [duplicates, rows, fuzzy, quality, string]
  status: stable
  notes: >
    Detects near-duplicate rows via token-based blocking (inverted index) +
    difflib.SequenceMatcher character similarity. No extra dependencies (stdlib
    only). similarity_threshold configurable (default 0.85). Sampling when
    n > max_comparison_rows (default 5000) with reliability warning. Findings
    stored under __dataset__ sentinel key (row-level, not column-level).
    Complements detect_duplicates (exact matches).

- name: missingness_mechanism_analysis
  display_name: Missingness Mechanism Analysis
  phase: eda
  stage: cleaned
  profiling_depth: standard
  runtime_estimate: moderate
  depends_on: [infer_types, summarize_nulls]
  semantic_types: [any]
  tags: [missingness, mcar, mar, mnar, quality]
  status: stable
  notes: >
    Analyses the likely mechanism behind missing values (Rubin 1976).
    Little's MCAR test (diagonal covariance approximation); missingness
    indicator correlations via point-biserial r; group difference tests via
    Mann-Whitney U. consistent_with field replaces verdicts - never claims
    to confirm MNAR (unverifiable) or MAR (not directly testable). Confidence
    capped at "moderate". epistemic_note in summary documents test limitations.
    Reads null_percentages from summarize_nulls context result.

# ── EDA tasks - time series ──────────────────────────────────────────────────────────────

- name: compute_acf_pacf
  display_name: ACF / PACF
  phase: eda
  stage: cleaned
  profiling_depth: standard
  runtime_estimate: fast
  depends_on: [infer_types, temporal_gap_detection]
  semantic_types: [continuous]
  tags: [time_series, autocorrelation, acf, pacf]
  status: stable
  notes: >
    ACF and PACF via statsmodels for each value column. Confidence bands at
    configured alpha using Bartlett (ACF) and asymptotic (PACF) formulas.
    Significant lags identified; guidance interprets AR/MA/ARMA pattern.
    Reduces max_lags automatically for short series. Graceful no-op when
    time_series.enabled=false or datetime_index_column not set. Warnings
    logged when temporal_gap_detection found large gaps in the index column.

- name: detect_stationarity
  display_name: Stationarity Tests (ADF / KPSS)
  phase: eda
  stage: cleaned
  profiling_depth: standard
  runtime_estimate: fast
  depends_on: [infer_types, temporal_gap_detection]
  semantic_types: [continuous]
  tags: [time_series, stationarity, adf, kpss, unit_root]
  status: stable
  notes: >
    ADF (H0: unit root) and KPSS (H0: stationary) - opposite null hypotheses.
    Four outcomes: agree-stationary, agree-non-stationary, both-reject (ambiguous/
    trend-stationary), neither-rejects (inconclusive). consistent_with field
    never produces a definitive verdict. Confidence capped at "moderate".
    epistemic_note in summary explains complementary test design. Caveats always
    present per column. Graceful no-op when time series disabled.

- name: decompose_time_series
  display_name: Time Series Decomposition (STL)
  phase: eda
  stage: cleaned
  profiling_depth: standard
  runtime_estimate: moderate
  depends_on: [infer_types, temporal_gap_detection]
  semantic_types: [continuous]
  tags: [time_series, decomposition, stl, trend, seasonal]
  status: stable
  notes: >
    STL decomposition via statsmodels (robust=True default). Seasonal period:
    configured -> inferred from frequency alias (D->7, ME->12 etc.) -> graceful
    skip. Trend and seasonal strength via Wang/Smith/Hyndman 2006 variance
    decomposition. Timestamps serialised as ISO strings. group_by_column
    reserved for future panel TS support - warns if set, does not fail.
    Graceful no-op when time series disabled or period cannot be determined.
