  depends_on: [infer_types]
  semantic_types: [datetime]
  tags: [datetime, feature_engineering, ml_readiness]
  status: stable
  notes: >
    Analyses datetime columns and recommends derived features based on temporal
    range and component variation. Ordinal: year, month, day_of_month,
    day_of_week, hour, quarter, week_of_year, days_since_epoch. Binary:
    is_weekend, is_month_start, is_month_end. Cyclic: month_sin_cos,
    day_of_week_sin_cos, hour_sin_cos. Features filtered to those relevant
    for the column's actual data. Purely advisory - never modifies the DataFrame.

