- name: compute_kurtosis
  display_name: Compute Kurtosis
  phase: eda
  stage: cleaned
  profiling_depth: standard
  runtime_estimate: fast
  depends_on: [infer_types]
  semantic_types: [continuous]
  tags: [distribution, kurtosis, statistics, numeric]
  status: stable
  notes: >
    Fisher excess kurtosis (normal = 0) via scipy.stats.kurtosis(fisher=True,
    bias=False). Four classifications: mesokurtic, mildly_leptokurtic,
    strongly_leptokurtic, platykurtic. EDA and ML guidance for notable columns.
    Complements detect_skewness - skewness measures asymmetry, kurtosis
    measures tail weight.

- name: normality_tests
  display_name: Normality Tests
  phase: eda
  stage: cleaned
  profiling_depth: standard
  runtime_estimate: fast
  depends_on: [infer_types]
  semantic_types: [continuous]
  tags: [distribution, normality, statistics]
  status: stable
  notes: >
    Shapiro-Wilk (n ≤ 5000), Kolmogorov-Smirnov (n > 5000), and Jarque-Bera
    (all n). Overall verdict is non_normal if either primary test or JB rejects
    at alpha (default 0.05). EDA and ML guidance with transform recommendations
    for non-normal columns.

- name: detect_outliers
  display_name: Detect Outliers
  phase: eda
  stage: cleaned
  profiling_depth: full
  runtime_estimate: moderate
  depends_on: [infer_types]
  semantic_types: [continuous]
  tags: [outliers, numeric, robust, mad, isolation_forest]
  status: stable
  notes: >
    Unified outlier detection: IQR fences, standard Z-score, Modified Z-score
    (MAD), and Isolation Forest (multivariate). method="all" (default) runs all
    three univariate methods in a single pass. consensus flag set when >= 2
    methods independently flag a column. Isolation Forest stored under
    __dataset__ sentinel key (row-level findings). run_isolation_forest=true
    by default with method="all". Supersedes outlier_detection_mad.
    BREAKING: old flat dict keys (outlier_counts, outlier_flags, outlier_rows)
    replaced by column-keyed sub-dicts with iqr/zscore/mad sub-entries.

