name: Dashboard / UI Issue
description: Something on the Vue dashboard rendered incorrectly, is missing, or behaved unexpectedly.
title: "[UI]: "
labels: ["dashboard", "bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for issues with the dashboard (`dsbf dashboard`) —
        blank panels, misaligned components, missing data, JS errors, unreadable text in
        the light or dark theme, etc.
        For backend task failures that produce incorrect data, use the Bug Report template instead.

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "e.g. Chrome 124, Firefox 125, Safari 17"
    validations:
      required: true

  - type: dropdown
    id: tab
    attributes:
      label: Which page?
      description: The pages that are not built yet (findings, columns, relationships, quality, ML readiness, time series) are added as each one lands.
      options:
        - Datasets and runs lists
        - Run overview (health, policy, finding counts)
        - Multiple pages
        - Not page-specific
    validations:
      required: true

  - type: input
    id: component
    attributes:
      label: Which component or section? (if known)
      placeholder: "e.g. Run health panel, Policy verdict, Findings by dimension, Top findings"

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe what you saw. Screenshots are very helpful — paste them directly into this field.
      placeholder: |
        The run overview shows a blank Run health panel when the dataset has only one column.
        No JS error in the console.
    validations:
      required: true

  - type: textarea
    id: what-expected
    attributes:
      label: What did you expect to happen?
      placeholder: "The panel lists every check with its status and reason."
    validations:
      required: true

  - type: textarea
    id: dataset-context
    attributes:
      label: Dataset context
      description: >
        Describe the dataset that triggered the issue — shape, column mix,
        any notable characteristics. No actual data needed.
      placeholder: "100 rows, 1 continuous column, no categorical columns."

  - type: textarea
    id: console-errors
    attributes:
      label: Browser console errors (if any)
      render: shell
      placeholder: "Paste any errors from the browser developer console here."

  - type: input
    id: dsbf-version
    attributes:
      label: DSBF version
      placeholder: "e.g. 1.0.0a1"
