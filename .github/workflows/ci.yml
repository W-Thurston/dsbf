name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer run for the same pull request replaces an older one. Pushes to main,
# scheduled and manual runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job only reads the repository (artifact upload uses the runtime token).
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Ruff comes from uv.lock, so CI lints and formats exactly like local tooling.
      # An unpinned install takes every new release: ruff 0.17 started formatting
      # Python code blocks in Markdown, which failed lint with no code change. Keep
      # the ruff rev in .pre-commit-config.yaml in step with uv.lock.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Install Ruff (version from uv.lock)
        run: uv sync --frozen --only-group dev

      - name: Ruff check
        run: uv run --no-sync ruff check .

      - name: Ruff format check
        run: uv run --no-sync ruff format --check .

  # Pyrefly runs on one interpreter: [tool.pyrefly] pins python-version and platform,
  # so the committed baseline doesn't depend on the matrix. Existing errors sit in
  # .pyrefly-baseline.json; any new error fails, and so does a baseline entry that no
  # longer matches (prune it with --prune-baseline).
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      # Pyrefly resolves imports from the project environment, so it needs the
      # runtime dependencies as well as the pinned pyrefly in the dev group.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Pyrefly check
        run: uv run --no-sync pyrefly check --baseline .pyrefly-baseline.json --error-stale-baseline

  # The fast gate runs only `unit` tests that are not `slow`: no network and no
  # full engine run. It fails first so most mistakes surface in about a minute.
  fast:
    name: Fast gate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run fast gate
        run: uv run --no-sync pytest -m "unit and not slow" --tb=short -q

  # The lock holds pandas 3 (new string dtype, copy-on-write), but the `pandas` extra
  # accepts 2.3 too, so this leg overlays the oldest supported pandas on the locked
  # environment for the adapter tests only. The variable makes one test fail if the
  # overlay didn't take.
  pandas2:
    name: Source adapters on pandas 2
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run adapter tests on pandas 2
        env:
          DSBF_TEST_PANDAS_MAJOR: "2"
        run: uv run --no-sync --with "pandas>=2.3,<3" pytest tests/test_data -m unit --tb=short -q

  # The base install on its own, then with each extra alone, from the lock and without
  # the dev group. `tests/test_extras.py` asserts that the checks of an extra that is
  # not installed report `unavailable` and the rest run. The `package` job runs the
  # installed command. The `sql` extra gates no code yet; the `server` extra gates `dsbf.store`.
  extras:
    name: Install with ${{ matrix.extra }}
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        extra: [none, ml, timeseries, text, excel, pandas, server]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Install the base and the extra
        run: |
          if [ "${{ matrix.extra }}" = none ]; then
            uv sync --frozen --no-dev --group extras
          else
            uv sync --frozen --no-dev --group extras --extra ${{ matrix.extra }}
          fi

      - name: Extras tests
        run: uv run --no-sync pytest tests/test_extras.py -m integration --tb=short -q

  # The full suite adds the integration, slow and network tests (the engine runs
  # on seaborn's titanic dataset, which needs network access).
  full:
    name: Full suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: fast

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      # The floor is the measured total (96%, 2026-10-29) rounded down to a multiple of 5.
      - name: Run full suite
        run: |
          uv run --no-sync pytest --tb=short -q --junitxml=test-results/junit.xml \
            --cov=dsbf --cov-report=xml:test-results/coverage.xml --cov-report=term \
            --cov-fail-under=95

      - name: Summarise coverage
        if: always() && matrix.python-version == '3.12'
        run: |
          uv run --no-sync coverage report --format=markdown > coverage.md || true
          { echo "### Coverage"; echo; cat coverage.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: test-results/

  # The wheel a user installs, not the checkout: build it, install it into a clean venv
  # with no extras and no lock, and run `dsbf check` from a temporary directory. The
  # frontend is built first, so the wheel carries the dashboard, and the smoke starts
  # `dsbf dashboard` and fetches the page and a run summary.
  package:
    name: Wheel smoke install
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build the dashboard into the wheel's files
        shell: bash
        run: .github/scripts/build_dashboard.sh

      - name: Build
        run: uv build

      - name: Check the metadata
        run: uvx twine check dist/*

      - name: Install and run the wheel
        run: .github/scripts/smoke_install.sh dist/*.whl

  # Windows has no `forkserver`, so the engine starts its workers with `spawn` (about
  # 0.44 s per check). This leg runs the engine tests on that path and the wheel smoke.
  windows:
    name: Windows
    runs-on: windows-latest
    needs: lint

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Engine and extras tests
        run: uv run --no-sync pytest tests/test_engine tests/test_extras.py tests/test_interfaces -m "unit or integration" --tb=short -q

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build the dashboard into the wheel's files
        shell: bash
        run: .github/scripts/build_dashboard.sh

      - name: Build and smoke install the wheel
        shell: bash
        run: |
          uv build
          .github/scripts/smoke_install.sh dist/*.whl

  # The frontend gate from CLAUDE.md. Node comes from .nvmrc and pnpm from the
  # packageManager field in frontend/package.json, so CI matches local tooling.
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint and Prettier)
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Bundle is within its size budget
        run: pnpm check:bundle

      - name: Unit tests
        run: pnpm test:run

  # The dashboard in a real browser, served by `dsbf dashboard` over a fixture store
  # (frontend/e2e/fixture_store.py). Opening a run must transfer under 200 KB.
  dashboard-e2e:
    name: Dashboard (Playwright)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          uv sync --frozen
          pnpm --dir frontend install --frozen-lockfile

      - name: Cache the Playwright browser
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      # Downloads nothing when the cache holds the browser; always installs its system libraries.
      - name: Install the Playwright browser
        run: pnpm --dir frontend exec playwright install --with-deps chromium

      - name: Build the dashboard
        run: pnpm --dir frontend build

      - name: Browser tests
        run: pnpm --dir frontend test:e2e

  # The published contracts: the checked-in JSON Schema and TypeScript types must be
  # what the models export, and a pull request must not break the schema on its base
  # branch without raising SCHEMA_VERSION (dsbf/model/run.py). Full history, so the
  # base branch is there to compare with.
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          uv sync --frozen
          pnpm --dir frontend install --frozen-lockfile

      - name: Schema and types are up to date
        run: uv run --no-sync dsbf schema export --types frontend/src/generated/run.d.ts --check

      - name: Command-line and check references are up to date
        run: uv run --no-sync dsbf docs export --check

      - name: Schema change is announced by its version
        if: github.event_name == 'pull_request'
        run: uv run --no-sync dsbf schema check --base origin/${{ github.base_ref }}
