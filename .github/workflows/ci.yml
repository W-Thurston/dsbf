name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every job only reads the repository (artifact upload uses the runtime token).
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Ruff comes from uv.lock, so CI lints and formats exactly like local tooling.
      # An unpinned install takes every new release: ruff 0.17 started formatting
      # Python code blocks in Markdown, which failed lint with no code change. Keep
      # the ruff rev in .pre-commit-config.yaml in step with uv.lock.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install Ruff (version from uv.lock)
        run: uv sync --frozen --only-group dev

      - name: Ruff check
        run: uv run --no-sync ruff check .

      - name: Ruff format check
        run: uv run --no-sync ruff format --check .

  # Pyrefly runs on one interpreter: [tool.pyrefly] pins python-version and platform,
  # so the committed baseline doesn't depend on the matrix. Existing errors sit in
  # .pyrefly-baseline.json; any new error fails, and so does a baseline entry that no
  # longer matches (prune it with --prune-baseline).
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      # Pyrefly resolves imports from the project environment, so it needs the
      # runtime dependencies as well as the pinned pyrefly in the dev group.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Pyrefly check
        run: uv run --no-sync pyrefly check --baseline .pyrefly-baseline.json --error-stale-baseline

  # The fast gate runs only `unit` tests that are not `slow`: no network and no
  # full engine run. It fails first so most mistakes surface in about a minute.
  fast:
    name: Fast gate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run fast gate
        run: uv run --no-sync pytest -m "unit and not slow" --tb=short -q

  # The source adapters take pandas 3 frames (new string dtype, copy-on-write), but the
  # legacy tasks still need pandas 2, so the base pin stays `<3` and this leg overlays
  # pandas 3 on the locked environment for the adapter tests only. The variable makes
  # one test fail if the overlay didn't take.
  pandas3:
    name: Source adapters on pandas 3
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run adapter tests on pandas 3
        env:
          DSBF_TEST_PANDAS_MAJOR: "3"
        run: uv run --no-sync --with "pandas>=3,<4" pytest tests/test_data -m unit --tb=short -q

  # The full suite adds the integration, slow and network tests (the engine runs
  # on seaborn's titanic dataset, which needs network access).
  full:
    name: Full suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: fast

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run full suite
        run: uv run --no-sync pytest --tb=short -q --junitxml=test-results/junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: test-results/

  # The frontend gate from CLAUDE.md. Node comes from .nvmrc and pnpm from the
  # packageManager field in frontend/package.json, so CI matches local tooling.
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint and Prettier)
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test:run

  # The published contracts: the checked-in JSON Schema and TypeScript types must be
  # what the models export, and a pull request must not break the schema on its base
  # branch without raising SCHEMA_VERSION (dsbf/model/run.py). Full history, so the
  # base branch is there to compare with.
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          uv sync --frozen
          pnpm --dir frontend install --frozen-lockfile

      - name: Schema and types are up to date
        run: uv run --no-sync dsbf schema export --types frontend/src/generated/run.d.ts --check

      - name: Schema change is announced by its version
        if: github.event_name == 'pull_request'
        run: uv run --no-sync dsbf schema check --base origin/${{ github.base_ref }}
