name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Pin ruff to the version in poetry.lock so CI lints and formats exactly like
      # local tooling. An unpinned install takes every new release: ruff 0.17 started
      # formatting Python code blocks in Markdown, which failed lint with no code
      # change. Keep the ruff rev in .pre-commit-config.yaml in step with the lock.
      - name: Install Ruff (version from poetry.lock)
        run: |
          RUFF_VERSION=$(python -c "import tomllib; print(next(p['version'] for p in tomllib.load(open('poetry.lock', 'rb'))['package'] if p['name'] == 'ruff'))")
          echo "Installing ruff==${RUFF_VERSION}"
          pip install "ruff==${RUFF_VERSION}"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        include:
          # 3.14 is recent — track compatibility but don't block on failures
          - python-version: "3.14"
            experimental: true
    continue-on-error: ${{ matrix.experimental == true }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 - --version 1.8.2
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache Poetry dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Configure Poetry
        run: poetry config virtualenvs.create false

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run unit tests
        run: poetry run pytest --tb=short -q

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: .pytest_cache/
