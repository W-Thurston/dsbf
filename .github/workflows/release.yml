name: Release

# Pushing a tag `v<version>` builds the wheel and sdist, installs the wheel in a clean
# venv, and publishes to PyPI with trusted publishing (OIDC, no token). The `pypi`
# environment holds the approval gate; register the publisher on PyPI first (project
# `dsbf`, workflow `release.yml`, environment `pypi`).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: The tag matches the version in pyproject.toml
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${version}" >&2
            exit 1
          fi

      - name: Build
        run: uv build

      - name: Check the metadata
        run: uvx twine check dist/*

      - name: Install and run the wheel
        run: .github/scripts/smoke_install.sh dist/*.whl

      - name: Upload the distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/dsbf/
    permissions:
      id-token: write

    steps:
      - name: Download the distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@v1.14.3
