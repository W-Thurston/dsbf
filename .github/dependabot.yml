version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    # These upgrades change reported results or the dataframe layer, so each is taken
    # by the unit that owns that code (see "Dependency upgrades" in ROADMAP.md). Drop
    # an entry, and raise the matching cap in pyproject.toml, when that unit lands.
    ignore:
      - dependency-name: pandas
        versions: [">=3"]
      - dependency-name: polars
        versions: [">=2"]
      - dependency-name: statsmodels
        versions: [">=0.15"]
      - dependency-name: scikit-learn
        versions: [">=1.8"]
      - dependency-name: plotly
        versions: [">=7"]
      - dependency-name: scipy
        versions: [">=1.18"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
