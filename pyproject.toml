[project]
name = "dsbf"
version = "0.20.0"
description = "Data Scientist's Best Friend — a statistically grounded EDA and data quality engine"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Will Thurston", email = "WilliamD.Thurston@gmail.com" }]
keywords = ["data-profiling", "eda", "data-quality", "pandas", "polars", "fastapi", "vue"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pyyaml>=6.0.1,<7",
    "pandas>=2.3.0,<3",
    "seaborn>=0.13.2,<0.14",
    "scikit-learn>=1.7.0,<1.8",
    "polars>=1.30.0,<2",
    "pyarrow>=20,<27",
    "networkx>=3.5,<4",
    "matplotlib>=3.10.3,<4",
    "graphviz>=0.21,<0.22",
    "pydot>=4.0.1,<5",
    "missingno>=0.5.2,<0.6",
    "statsmodels>=0.14.4,<0.15",
    "psutil>=7.0.0,<8",
    "plotly>=6.2.0,<7",
    "rich>=14.0.0,<16",
    "typer>=0.16.0,<0.28",
    "watchfiles>=1.1.0,<2",
    "fastapi>=0.135.1,<0.144",
    "uvicorn>=0.41.0,<0.55",
]

[project.urls]
Homepage = "https://github.com/W-Thurston/dsbf"
Repository = "https://github.com/W-Thurston/dsbf"

[project.scripts]
dsbf = "dsbf.interfaces.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0,<10",
    "httpx2>=2.13,<3",
    "pytest-order>=1.3.0,<2",
    "ruff>=0.11.10,<0.18",
    "pre-commit>=4.2.0,<5",
    "ipykernel>=6.29.5,<8",
    "pyrefly>=1.1.1,<2",
]

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# uv_build ignores .gitignore, so keep frontend build artefacts out of the sdist and
# wheel. The package sits under src/, so run output and the local database in the
# repository's dsbf/ directory are outside it.
source-exclude = [
    "src/dsbf/dashboard/frontend/node_modules/**",
    "src/dsbf/dashboard/frontend/dist/**",
]
wheel-exclude = [
    "dashboard/frontend/node_modules/**",
    "dashboard/frontend/dist/**",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".eggs", ".git", ".mypy_cache", ".pytest_cache",
    ".ruff_cache", ".venv", "build", "dist", "dsbf/outputs",
]

[tool.ruff.lint]
# E/W: pycodestyle  F: pyflakes  I: isort  UP: pyupgrade
select = ["E", "W", "F", "I", "UP"]
ignore = [
    "COM812",  # trailing comma — conflicts with ruff formatter
    "E203",    # whitespace before ":" — Black-compatible
]

[tool.ruff.lint.isort]
known-first-party = ["dsbf"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pyrefly]
# The default preset, not the `basic` one pyrefly picks when unconfigured: `basic`
# finds almost nothing. Errors that predate the checker live in the committed
# .pyrefly-baseline.json, which only the CLI can load (see CONTRIBUTING.md), so new
# code is checked in full. Pin the interpreter and platform so the baseline doesn't
# depend on the machine that wrote it.
preset = "default"
python-version = "3.12"
python-platform = "linux"
# The package lives under src/ and the tests import `tests.helpers`, so name both roots
# rather than rely on the heuristic that picks one.
search-path = ["src", "."]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers -m \"not golden and not perf\""
testpaths = ["tests"]
# Every test carries exactly one tier (unit, integration, golden or perf) and may add
# the slow and network modifiers; tests/conftest.py fails collection otherwise.
# The golden and perf tiers take minutes, so addopts deselects them; `-m golden` or
# `-m perf` on the command line replaces that expression.
markers = [
    "unit: fast, isolated test with no network and no full engine run",
    "integration: exercises several components together, such as the engine or the API",
    "slow: takes more than 5 s on a developer machine; excluded from the fast gate",
    "network: needs network access, such as a seaborn dataset download",
    "golden: compares a full run against a committed snapshot; deselected by default, run with -m golden",
    "perf: times full runs against a committed baseline; deselected by default, run with -m perf",
]
