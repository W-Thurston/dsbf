[project]
name = "dsbf"
version = "0.20.0"
description = "Data Scientist's Best Friend — a statistically grounded EDA and data quality engine"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Will Thurston", email = "WilliamD.Thurston@gmail.com" }]
keywords = ["data-profiling", "eda", "data-quality", "pandas", "polars"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=2.3,<3",
    "scipy>=1.16,<2",
    "polars>=2.0,<3",
    "pyarrow>=20,<27",
    "pydantic>=2.12,<3",
    "pyyaml>=6.0.1,<7",
    "psutil>=7.0.0,<8",
    "platformdirs>=4.3,<5",
    "rich>=14.0.0,<16",
    "typer>=0.16.0,<0.28",
]

[project.optional-dependencies]
# The split from ADR 0009. The base install above holds what every run imports at
# module level; each extra holds what one group of checks or sources imports when it
# runs, and the engine reports a check whose extra is missing as `unavailable`.
ml = ["scikit-learn>=1.8,<2"]
timeseries = ["statsmodels>=0.14.4,<1"]
text = ["rapidfuzz>=3.14,<4"]
excel = ["fastexcel>=0.21,<1"]
pandas = ["pandas>=2.3.0,<4"]
sql = ["ibis-framework>=12,<13"]
server = [
    "fastapi>=0.135.1,<0.144",
    "uvicorn>=0.41.0,<0.55",
    "sqlalchemy>=2.1,<3",
    "alembic>=1.20,<2",
]
all = ["dsbf[ml,timeseries,text,excel,pandas,sql,server]"]

[project.urls]
Homepage = "https://github.com/W-Thurston/dsbf"
Repository = "https://github.com/W-Thurston/dsbf"

[project.scripts]
dsbf = "dsbf.interfaces.cli:app"

[dependency-groups]
# The tests exercise every check and the pandas input, so the dev group carries the
# extras that gate them. The `extras` group is what the CI install matrix adds to one
# extra at a time.
dev = [
    "dsbf[ml,timeseries,text,excel,pandas]",
    "pytest>=8.0.0,<10",
    "ruff>=0.11.10,<0.18",
    "pre-commit>=4.2.0,<5",
    "ipykernel>=6.29.5,<8",
    "pyrefly>=1.1.1,<2",
    "jsonschema>=4.23,<5",
    "packaging>=24",
    # The Excel round trip in tests/test_data needs a writer; the reader is the
    # `excel` extra's.
    "xlsxwriter>=3.2,<4",
    "hypothesis>=6.170.5",
    # Pandas 2 carried the time zone database the tests read through `zoneinfo`; the
    # runtime reads zones through Polars, which bundles its own.
    "tzdata>=2025.2",
]
extras = ["pytest>=8.0.0,<10"]

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".eggs", ".git", ".mypy_cache", ".pytest_cache",
    ".ruff_cache", ".venv", "build", "dist", "dsbf/outputs",
]

[tool.ruff.lint]
# E/W: pycodestyle  F: pyflakes  I: isort  UP: pyupgrade
select = ["E", "W", "F", "I", "UP"]
ignore = [
    "COM812",  # trailing comma — conflicts with ruff formatter
    "E203",    # whitespace before ":" — Black-compatible
]

[tool.ruff.lint.isort]
known-first-party = ["dsbf"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pyrefly]
# The default preset, not the `basic` one pyrefly picks when unconfigured: `basic`
# finds almost nothing. Errors that predate the checker live in the committed
# .pyrefly-baseline.json, which only the CLI can load (see CONTRIBUTING.md), so new
# code is checked in full. Pin the interpreter and platform so the baseline doesn't
# depend on the machine that wrote it.
preset = "default"
python-version = "3.12"
python-platform = "linux"
# The package lives under src/ and the tests import `tests.helpers`, so name both roots
# rather than rely on the heuristic that picks one.
search-path = ["src", "."]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers -m \"not golden and not perf and not calibration\""
testpaths = ["tests"]
# Every test carries exactly one tier (unit, integration, golden, perf or calibration) and may add
# the slow and network modifiers; tests/conftest.py fails collection otherwise.
# The golden, perf and calibration tiers take minutes, so addopts deselects them; `-m golden`,
# `-m perf` or `-m calibration` on the command line replaces that expression.
markers = [
    "unit: fast, isolated test with no network and no full engine run",
    "integration: exercises several components together, such as the engine or the API",
    "slow: takes more than 5 s on a developer machine; excluded from the fast gate",
    "network: needs network access, such as a seaborn dataset download",
    "golden: compares a full run against a committed snapshot; deselected by default, run with -m golden",
    "perf: times full runs against a committed baseline; deselected by default, run with -m perf",
    "calibration: measures false-alarm and detection rates on planted-truth datasets against a committed baseline; deselected by default, run with -m calibration",
]
