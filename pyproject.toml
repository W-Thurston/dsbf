[tool.poetry]
name = "dsbf"
version = "0.20.0"
description = "Data Scientist's Best Friend — a statistically grounded EDA and data quality engine"
authors = ["Will Thurston <WilliamD.Thurston@gmail.com>"]
readme = "README.md"
license = "MIT"
packages = [{ include = "dsbf" }]
homepage = "https://github.com/W-Thurston/dsbf"
repository = "https://github.com/W-Thurston/dsbf"
keywords = ["data-profiling", "eda", "data-quality", "pandas", "polars", "fastapi", "vue"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.poetry.dependencies]
python = ">=3.12"
pyyaml = "^6.0.1"
pandas = "^2.3.0"
seaborn = "^0.13.2"
scikit-learn = "^1.7.0"
polars = "^1.30.0"
pyarrow = "^20.0.0"
networkx = "^3.5"
matplotlib = "^3.10.3"
graphviz = "^0.21"
pydot = "^4.0.1"
missingno = "^0.5.2"
statsmodels = "^0.14.4"
psutil = "^7.0.0"
plotly = "^6.2.0"
rich = "^14.0.0"
typer = "^0.16.0"
watchfiles = "^1.1.0"
fastapi = "^0.135.1"
uvicorn = "^0.41.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-order = "^1.3.0"
ruff = "^0.11.10"
pre-commit = "^4.2.0"
ipykernel = "^6.29.5"

[tool.poetry.scripts]
dsbf = "dsbf.interfaces.cli:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".eggs", ".git", ".mypy_cache", ".pytest_cache",
    ".ruff_cache", ".venv", "build", "dist", "dsbf/outputs",
]

[tool.ruff.lint]
# E/W: pycodestyle  F: pyflakes  I: isort  UP: pyupgrade
select = ["E", "W", "F", "I", "UP"]
ignore = [
    "COM812",  # trailing comma — conflicts with ruff formatter
    "E203",    # whitespace before ":" — Black-compatible
]

[tool.ruff.lint.isort]
known-first-party = ["dsbf"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
